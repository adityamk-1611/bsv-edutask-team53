name: Backend Tests

on: push

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.pip
          pip install pytest pytest-cov

      - name: Run tests
        run: |
          cd backend
          python -m pytest test/demo/unit